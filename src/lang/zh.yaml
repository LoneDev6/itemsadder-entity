iaentitymodel:
  plugin:
    title: ItemsAdder Entity

  menubar:
    dropdown: ItemsAdder Entity
    settings: 设置
    export: 导出模型
    about: 关于...

  panels:
    variants:
      title: 模型变体（尚未实现）
      addVariant:
        title: 添加变体
        description: 向模型添加新变体
      back: 返回

  popups:
    exportCancelled: 导出已取消！
    exportInProgress: 正在导出！
    noExporterSelected: 未选择导出器！
    successfullyExported: 导出成功！
    projectNotSaved: 导出前请先保存项目！

  progress:
    animationRendering: 正在渲染动画... %currents/%totals

  settings:
    header: ItemsAdder Entity 设置
    isGlobal: '(全局)'
    isOptional: '(可选)'

    generic:
      errors:
        invalid: 如果你看到这条消息，表示 ItemsAdder Entity 出故障了。（糟糕）
        emptyValue: 值不能为空
        mustBeBoolean: 值必须是布尔值
        mustBeString: 值必须是字符串
        missingFormatString: 值缺少必需的 %notFound 格式化字符串
        invalidEntityTag: 值不是有效的实体标签

    playerAnimationsName:
      errors:
        invalidFunctionName: 玩家动画文件无效！

    namespace:
      title: 实体命名空间
      description:
      - 你的实体命名空间。
      errors:
        invalidFunctionName: 实体命名空间无效！

    projectName:
      title: 实体 ID
      description:
      - 你的实体唯一 ID。
      errors:
        invalidFunctionName: 实体 ID 无效！

    modelScalingMode:
      title: 模型缩放模式
      description:
      - 最大模型尺寸可支持宽度为 7x7x7 方块的模型，但缩放仅限缩小。
      - 最大缩放范围可缩小和放大到 3.125x，但会将最大模型尺寸限制为 3x3x3 方块
      options:
        3x3x3: 最大缩放
        7x7x7: 最大模型尺寸

    verbose:
      title: 详细输出
      description:
      - 指示所选导出器是否导出额外的调试/错误消息。
      - 实际上只会影响雕像和动画导出器。

    transparentTexturePath:
      title: 透明纹理路径
      description:
      - 用于为变体添加透明效果的透明纹理。只有在变体中使用透明效果时才需要。
      errors:
        undefinedWhenNeeded: 如果你使用变体的透明功能，必须定义路径！

    useCache:
      title: 使用动画缓存
      description:
      - 只重新渲染已更改的动画

    addsAdditionalModels:
      title: 允许玩家动画中的额外模型
      description:
      - 如果你在场景中添加了新的骨骼/模型，请启用此选项（例如配件、其他实体、物品...）

    cacheMode:
      title: 动画缓存模式
      description:
      - 动画缓存可以只重新渲染自上次导出后发生更改的动画。重复导出会快得多，尤其是大型模型。
      - "- 内存模式更快，但会使用更多内存来存储缓存。"
      - "- 磁盘模式较慢，但会将缓存保存到磁盘以节省内存使用量。"
      options:
        memory: 内存模式
        disk: 磁盘模式

    rotationMode:
      title: 旋转模式
      description:
      - "ItemsAdder 提供两种骨骼旋转模式。"
      - "你必须根据实体要做的事来选择："
      - " - 平滑：适合不会快速移动且骨骼较少的 NPC 和实体。"
      - " - 精确：适合有大量骨骼和/或移动很快的生物（例如：奔跑、跳跃、飞行、有复杂攻击的 Boss 等）。"
      options:
        smooth: 平滑
        precise: 精确

    boundingBoxRenderMode:
      title: 骨骼尺寸限制框
      description:
      - "配置或禁用骨骼尺寸限制框。"
      - "- 单个一次只显示一个框。"
      - "- 多个会为你选择的每个骨骼显示一个框。"
      - "- 禁用会完全关闭它。"
      options:
        single: 单个
        many: 多个
        none: 禁用

    idleAnim:
      title: 待机动画
      description:
      - 待机动画名称

    walkAnim:
      title: 行走动画
      description:
      - 行走动画名称

    attackAnim:
      title: 攻击动画
      description:
      - 攻击动画名称

    deathAnim:
      title: 死亡动画
      description:
      - 死亡动画名称

    flyAnim:
      title: 飞行动画
      description:
      - 飞行动画名称

    invalidAnim: 无效的动画名称

  menu:
    animation:
      animType:
        title: "动画类型"
        value:
          other: "其他"
          idle: "待机"
          walk: "行走"
          attack: "攻击"
          death: "死亡"
          fly: "飞行"

  dialogs:
    boneConfig:
      title: 骨骼配置
      boneNbt: 骨骼 NBT
      boneType: 骨骼类型
      head: 头部
      normal: 通用骨骼
      leftHandPivot: 左手枢轴
      rightHandPivot: 右手枢轴
      hatPivot: 帽子枢轴
      mount: 坐骑点（用作座位位置）
      locator: 定位器（用作效果位置）
      hitbox: Hitbox（可被攻击/交互的区域）
      hitboxMultiCubeWarning: 你确定吗？此骨骼有超过一个方块。所有纹理都将被移除。
      headProperties: "头部属性"
      maxHeadRotY: "最大头部 Y 角度"
      maxHeadRotX: "最大头部 X 角度"
    variants:
      title: 模型变体
      description:
      - 变体可让你的模型拥有不同的“skin”，并可在运行时使用函数切换。

    about:
      title: 关于 ItemsAdder Entity
      description:
      - 供服务器管理员为 ItemsAdder 创建平滑且细致动画的工具（Minecraft Java Edition 的 Spigot 插件）

      version: 版本
      buildID: 构建 ID

      creators: 创建者
      discordServer: 加入我的 Discord 服务器！
      githubRepo: 源码
      developers: 开发者
      originalDevelopers: 原始 Animated Java 开发者
      originalPluginInfo: 原始 Animated Java 插件信息
      patrons: 赞助者
      honourableMentions: 特别鸣谢

      fetchbotQuote: '"也让 java 生物跳舞吧！"'
      snavesutitQuote: '"armor_stand 是爱，armor_stand 是生命。"'

      youtuber: YouTuber
      translator: 翻译者
      contributor: 贡献者
      moderator: Discord 管理员
      closedBeta: 封闭 Beta 测试员
      brandingArtist: 品牌美术
      patronTier1: 第 1 级赞助者
      patronTier2: 第 2 级赞助者
      patronTier3: 第 3 级赞助者

    animationProperties:
      animationCompleteCommand:
        label: 动画结束命令

    errors:
      misc:
        title: ItemsAdder Entity 发生未知错误
        body:
        - |-
          <textarea style="height: 256px" readonly="readonly">
          ------ 错误 ------
          %errorMessage  //  "%randomErrorMessage"
          ------ 堆栈 ------
          %errorStack

          构建 ID: %buildID
          </textarea>
        - <p>请在 <a href="%githubLink">ItemsAdder Entity 的 github</a> 报告此错误，并提供复现方式和上方错误的副本。</p>
        - <p>你也可以加入我们的 <a href="%discordLink">Discord 服务器</a>，并在 animated-java-support 频道提问。</p>
        - <p>谢谢！</p>

      scaleOutOfBounds:
        title: 缩放超出范围
        body:
        - "骨骼 '%boneName' 在你的某个动画中存在无效缩放："
        - "%displayString"

      topLevelCubes:
        title: 模型包含顶层方块
        body:
        - 所有方块都必须位于组内。

      predicateMergeFailed:
        title: 谓词合并失败
        body:
        - "%reason"
        - ItemsAdder Entity 只支持合并到由 ItemsAdder Entity 控制的谓词模型。
        - 请确认你正在将谓词物品模型合并到有效且已存在的 ItemsAdder Entity 谓词物品模型。
        reasons:
          overridesMissing: 缺少模型覆盖列表。
          ajMetaMissing: 要合并的模型文件不是 ItemsAdder Entity 谓词文件。

      invalidAnimationSnappingValue:
        title: 无效的动画吸附值
        body:
        - 动画 '%animationName' 的吸附值为 %snapping！
        - 由于 Minecraft tick 速度很快，ItemsAdder Entity 只支持吸附值 20。
        - 导出前请更新你的动画和关键帧，以符合此限制。
        - （你可能需要在时间轴上稍微移动关键帧，以更新它们的吸附时间）

      rigFolderHasUnknownContent:
        title: 未使用的 rig 文件夹
        body:
        - 你选择作为 rig 模型文件夹的文件夹内有未知文件。
        - 你确定要用你的 rig 覆盖此文件夹的内容吗？
        - "已选文件夹："
        - <textarea>%path</textarea>
        - "未知文件："
        - <textarea>%files</textarea>

      rigFolderAlreadyUsedByOther:
        title: 选择的 rig 模型文件夹已被使用
        body:
        - 你选择作为 rig 模型文件夹的文件夹内已包含其他 rig 的模型。
        - 你确定要用你的 rig 覆盖此文件夹的内容吗？
        - "已选文件夹："
        - <textarea>%path</textarea>
        - "文件："
        - <textarea>%files</textarea>

      unableToGenerateTexturePath:
        title: 无效的纹理路径
        body:
        - 纹理 '%textureName' 在资源包中的位置无效
        - 请确认它已正确保存在有效资源包中的 'assets/namespace/textures/' 子文件夹内
        - 例如 'resources/assets/minecraft/textures/item/diamond.png'

      unableToGenerateModelPath:
        title: 无效的模型路径
        body:
        - 模型 '%modelName' 在资源包中的位置无效
        - 请确认它已正确保存在有效资源包中的 'assets/namespace/models/' 子文件夹内
        - 例如 'resources/assets/minecraft/models/item/diamond.json'

      invalidCubeRotations:
        title: 无效的元素旋转
        body:
        - 某些方块的旋转对 java 模型格式而言无效。
        - 导出前请修正所有无效旋转。

      unsavedTexture:
        title: 未保存的纹理
        body:
        - 纹理 '%textureName' 尚未保存到磁盘！
        - 请确认它已保存到有效的资源包位置。

      transparentTexturePathNotFound:
        title: 未定义透明纹理路径
        body:
        - 看起来你正在尝试在未定义纹理路径的情况下使用带透明纹理的变体！
        - 导出前，你需要在设置中配置透明纹理路径。

      rigModelsExportFolderUndefined:
        title: 未定义 rig 模型文件夹
        body:
        - 导出前，你必须在设置中定义 rig 模型文件夹路径。

  exporters:
    #? Generic Exporter Strings
    generic:
      progress:
        writingDataPack: 正在将数据包写入磁盘... %progress% | 正在写入 %fileName
        exportingDataPack: 正在生成数据包... %progress%

      settings:
        rootEntityType:
          title: 根实体类型
          description:
          - 用作模型根实体的实体类型
          errors:
            invalidEntity: 选择的实体不存在！

        rootEntityNbt:
          title: 根实体 NBT
          description:
          - 根实体的 NBT 数据
          errors:
            invalidNbt: 无效的 NBT！

        markerArmorStands:
          title: 标记盔甲架
          description:
          - 启用时，所有用于显示 rig 的 armor_stands 都不会有 hitbox 或碰撞。

        modelTag:
          title: 模型标签
          description:
          - 用于选择模型的标签

        rootTag:
          title: 根标签
          description:
          - 用于选择雕像根实体的标签

        allBonesTag:
          title: 所有骨骼标签
          description:
          - 用于选择雕像任意或全部骨骼的标签

        boneModelDisplayTag:
          title: 骨骼模型显示标签
          description:
          - 用于选择模型显示实体的标签（头上有物品的 armor_stands）

        individualBoneTag:
          title: 单个骨骼标签
          description:
          - 用于按名称选择特定骨骼的标签

        internalScoreboardObjective:
          title: 内部计分板
          description:
          - 用于内部计算的计分板目标名称

        idScoreboardObjective:
          title: 模型 ID 计分板
          description:
          - 用于识别哪些实体属于哪个模型实例的计分板目标名称

        exportMode:
          title: 导出模式
          description:
          - 要导出的格式。Vanilla 会导出普通数据包和资源包。
          - MCB 会导出资源包和供 lang-mc 编译器使用的 .mc 文件
          options:
            mcb: MCB
            vanilla: 原版

        itemsadderItemConfig:
          title: Lang-mc 文件
          description:
          - 要导出 .mc 文件的路径
          - 你需要在 MCB 工作区中安装 mc-extra，才能构建导出的数据包

        mcbConfigPath:
          title: Lang-mc config.json 路径
          description:
          - 导出 ItemsAdder Entity 的默认 MCB config
          - 警告！将覆盖现有的 config.json
          errors:
            mustBeNamedAfterProject: 路径必须以名为 %projectName.mc 的文件结尾！

    #? Vanilla Statue Exporter
    vanillaStatue:
      title: 雕像导出器

    #? Vanilla Animation Exporter
    vanillaAnimation:
      title: 动画导出器
      dialogs:
        errors:
          zeroLengthAnimation:
            title: 零长度动画
            body:
            - 动画 %animationName 太短！动画长度必须至少为 0.05 秒（或 1 个游戏 tick）

          noAnimations:
            title: 没有动画
            body:
            - 你还没有制作任何动画！
            - 使用动画导出器导出前，你需要在动画选项卡中创建一些动画。
          markerNoLoopAnim:
            message: 此动画的 "Loop Mode" 未设置为 "Loop"。设置标记前，请先将值改为 "Loop"。
          tooManyMarkers:
            message: 此动画已包含 2 个 "Loop Start/End" 标记！需要时可右键点击删除。
      settings:
        frameScoreboardObjective:
          title: 帧计分板
          description:
          - 用于跟踪动画下一帧应播放哪一帧的计分板目标名称

        animatingFlagScoreboardObjective:
          title: 动画标志计分板
          description:
          - 用于查询 rig 是否正在播放动画的计分板目标名称

        animationLoopModeScoreboardObjective:
          title: 动画循环模式计分板
          description:
          - 用于控制每个动画循环行为的计分板目标名称
      other:
        addLoopMarker: 添加循环开始/结束标记
        toggleLoopMarkers: 设置/移除循环开始/结束标记
